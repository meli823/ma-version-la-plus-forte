name: Publier mon application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Extraire l'application
        run: |
          rm -rf site
          mkdir -p site
          unzip -o ma_version_la_plus_forte_version_web.zip -d site
          mkdir -p site/videos

      - name: Télécharger et convertir les vidéos
        run: |
          set -e

          download_video() {
            url="$1"
            output="$2"
            echo "Téléchargement: $url"
            curl -L --fail --retry 3 -A "Mozilla/5.0" "$url" -o "$output"
          }

          # Copies Wikimedia Commons des vidéos CDC (domaine public)
          download_video "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscle_Strengthening_at_Home_-_Half_squat.webm" "site/videos/Half_squat_IPod_Lg_11bceac3.mp4"
          download_video "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscle_Strengthening_at_Home_-_Push-ups.webm" "site/videos/Push-ups_Ipod-Lg_64e6f55a.mp4"
          download_video "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscle_Strengthening_at_Home_-_Superman.webm" "site/videos/Superman_Ipod-Lg_8cf12020.mp4"
          download_video "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscle_Strengthening_at_Home_-_Bicep_Curls.webm" "site/videos/Biscep_Curls_Ipod-Lg_d100ffb7.mp4"
          download_video "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscle_Strengthening_at_Home_-_Toe_Lift.webm" "site/videos/Toe_Lift_Ipod-Lg_6da68b90.mp4"
          download_video "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscle_Strengthening_at_Home_-_Sit-ups.webm" "site/videos/Sit-ups_Ipod-Lg_4598d306.mp4"
          download_video "https://commons.wikimedia.org/wiki/Special:Redirect/file/Muscle_Strengthening_at_Home_-_Overhead_Press.webm" "site/videos/Overhead_Press_Ipod-Lg_4deff683.mp4"

          # Autres démonstrations Wikimedia Commons
          download_video "https://upload.wikimedia.org/wikipedia/commons/5/57/Strength_Training_Circuit-_Forward_Lunge.webm" "site/videos/Strength_Training_Circuit-_Forward_Lunge_f4e02206.mp4"
          download_video "https://upload.wikimedia.org/wikipedia/commons/f/f4/Dand_%28_Basic_version_%29.webm" "site/videos/Dand__28_Basic_version__29_005585d7.mp4"
          download_video "https://upload.wikimedia.org/wikipedia/commons/1/16/Basic_single_leg_squat.webm" "site/videos/Basic_single_leg_squat_2ee67629.mp4"
          download_video "https://upload.wikimedia.org/wikipedia/commons/7/7f/Squat_and_Frontal_Raise.webm" "site/videos/Squat_and_Frontal_Raise_4f5d32ca.mp4"
          download_video "https://upload.wikimedia.org/wikipedia/commons/2/21/Kettlebell_Lunge_and_Twist.webm" "site/videos/Kettlebell_Lunge_and_Twist_9b0a3e74.mp4"

          echo "Conversion en MP4..."
          for file in site/videos/*.mp4; do
            tmp="${file%.mp4}.tmp.mp4"
            ffmpeg -y -i "$file" -c:v libx264 -preset veryfast -crf 23 -c:a aac -movflags +faststart "$tmp"
            mv "$tmp" "$file"
          done

      - name: Vérifier les vidéos
        run: |
          count=$(find site/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          echo "Nombre de vidéos: $count"
          test "$count" -eq 12

      - name: Préparer GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
